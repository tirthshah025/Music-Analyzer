<!DOCTYPE html>
<html>
<head>
    <title>Music Analyzer Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎧 Music Analyzer Pro</h1>

<input type="text" id="playlistUrl" placeholder="Paste Spotify Playlist Link">

<button onclick="loadSpotify()">Load Playlist</button>

<p id="loading"></p>

<input type="text" id="search" placeholder="Search songs..." onkeyup="searchSongs()">

<canvas id="chart"></canvas>

<div id="songs"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
